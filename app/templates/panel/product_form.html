{% extends "panel/_base.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} product · Panel{% endblock %}
{% block panel_title %}{{ 'Edit' if product else 'New' }} product{% endblock %}

{% block panel_content %}
<form method="post" class="card p-4" style="max-width:760px;">
  <div class="row g-3">
    <div class="col-md-8">
      <label class="form-label">Name</label>
      <input name="name" class="form-control" required
             value="{{ product.name if product else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Category</label>
      <select name="category_id" class="form-select">
        <option value="">— None —</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Price</label>
      <input type="number" step="0.01" min="0" name="price" class="form-control" required
             value="{{ product.price if product else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Stock</label>
      <input type="number" min="0" name="stock" class="form-control"
             value="{{ product.stock if product else 0 }}">
    </div>
    <div class="col-md-4 d-flex align-items-end">
      <div class="form-check">
        <input type="checkbox" class="form-check-input" name="is_active" id="is_active"
               {% if not product or product.is_active %}checked{% endif %}>
        <label class="form-check-label" for="is_active">Active</label>
      </div>
    </div>
    <div class="col-12">
      <label class="form-label">Image URL</label>
      <input name="image_url" class="form-control"
             value="{{ product.image_url if product else '' }}">
    </div>
    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea name="description" rows="4" class="form-control">{{ product.description if product else '' }}</textarea>
    </div>
  </div>

  <div class="d-flex gap-2 mt-4">
    <button class="btn btn-dark">Save</button>
    <a href="{{ url_for('staff.products') }}" class="btn btn-outline-dark">Cancel</a>
  </div>
</form>
{% endblock %}
