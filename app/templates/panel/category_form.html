{% extends "panel/_base.html" %}
{% block title %}{{ 'Edit' if category else 'New' }} category · Panel{% endblock %}
{% block panel_title %}{{ 'Edit' if category else 'New' }} category{% endblock %}

{% block panel_content %}
<form method="post" class="card p-4" style="max-width:560px;">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" required value="{{ category.name if category else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Image URL</label>
    <input name="image_url" class="form-control" value="{{ category.image_url if category else '' }}">
    {% if category and category.image_url %}
      <img src="{{ category.image_url }}" alt="" class="mt-2" style="width:100px;height:100px;object-fit:cover;border-radius:8px;">
    {% endif %}
  </div>
  <div class="form-check mb-4">
    <input type="checkbox" class="form-check-input" name="visible" id="visible"
           {% if not category or category.visible %}checked{% endif %}>
    <label class="form-check-label" for="visible">Visible to customers</label>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-dark">Save</button>
    <a href="{{ url_for('staff.categories') }}" class="btn btn-outline-dark">Cancel</a>
  </div>
</form>
{% endblock %}
