{% extends "base.html" %}
{% block title %}Mock payment{% endblock %}
{% block content %}
<div class="section py-5" style="max-width:520px;">
  <div class="card p-4">
    <h1 class="h5">{{ _('Mock payment gateway') }} <span class="badge text-bg-warning">{{ _('development only') }}</span></h1>
    <p class="text-muted">No real money is involved. Amount: {{ '{:,}'.format(amount) }} Rial</p>
    <form method="post" class="d-flex gap-2">
      <button name="result" value="pay" class="btn btn-dark">{{ _('Pay') }}</button>
      <button name="result" value="cancel" class="btn btn-outline-dark">{{ _('Cancel') }}</button>
    </form>
  </div>
</div>
{% endblock %}
