{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit' if category else 'New' }} Category</h2>
<form method="post" class="mt-3" style="max-width:480px;">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" required
           value="{{ category.name if category else '' }}">
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="visible" id="visible"
           {% if not category or category.visible %}checked{% endif %}>
    <label class="form-check-label" for="visible">
      Visible to customers
    </label>
  </div>
  <button class="btn btn-primary">Save</button>
  <a href="{{ url_for('staff.categories') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
