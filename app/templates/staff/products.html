{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Products</h2>
  <a href="{{ url_for('staff.product_new') }}" class="btn btn-primary">+ New Product</a>
</div>
<table class="table bg-white rounded">
  <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr></thead>
  <tbody>
    {% for p in products %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.category.name if p.category else '—' }}</td>
      <td>${{ '%.2f'|format(p.price) }}</td>
      <td>{{ p.stock }}</td>
      <td>{{ '✅' if p.is_active else '❌' }}</td>
      <td class="text-end">
        <a href="{{ url_for('staff.product_edit', product_id=p.id) }}" class="btn btn-sm btn-outline-secondary">Edit</a>
        <form method="post" action="{{ url_for('staff.product_delete', product_id=p.id) }}" class="d-inline"
              onsubmit="return confirm('Delete this product?');">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
