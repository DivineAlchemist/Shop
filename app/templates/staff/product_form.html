{% extends "base.html" %}
{% block content %}
<h2>{{ 'Edit Product' if product else 'New Product' }}</h2>
<form method="post" class="card p-4">
  <div class="row g-3">
    <div class="col-md-8">
      <label class="form-label">Name</label>
      <input name="name" class="form-control" value="{{ product.name if product else '' }}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Category</label>
      <select name="category_id" class="form-select">
        <option value="">— None —</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {{ 'selected' if product and product.category_id == c.id else '' }}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Price</label>
      <input name="price" type="number" step="0.01" class="form-control"
             value="{{ product.price if product else '' }}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Stock</label>
      <input name="stock" type="number" class="form-control"
             value="{{ product.stock if product else 0 }}">
    </div>
    <div class="col-12">
      <label class="form-label">Image URL</label>
      <input name="image_url" class="form-control" value="{{ product.image_url if product else '' }}">
    </div>
    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea name="description" rows="4" class="form-control">{{ product.description if product else '' }}</textarea>
    </div>
    {% if product %}
    <div class="col-12 form-check ms-2">
      <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {{ 'checked' if product.is_active else '' }}>
      <label class="form-check-label" for="is_active">Active</label>
    </div>
    {% endif %}
  </div>
  <button class="btn btn-primary mt-3">{{ 'Save' if product else 'Create' }}</button>
</form>
{% endblock %}
